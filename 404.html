<head>

      var t = "dark"; try { var s = localStorage.getItem("theme"); if (s === "light" || s === "dark") t = s; } catch (e) {} document.documentElement.setAttribute("data-theme", t);

    .nf { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: var(--space-xl); }

</head>
